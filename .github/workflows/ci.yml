name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # クロスプラットフォームなコア層（WindowManagerCore）を Linux 上でビルド & テストする。
  # ウィンドウ操作の純ロジック（RPC フレーミング/ワイヤフォーマット・座標変換）はここで保証される。
  linux-test:
    name: Linux (swift test, core)
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # ruby.wasm は容量が大きく未コミット（.gitignore 済み）。SwiftPM は宣言した
      # リソースが存在しないとビルドに失敗するため、空のプレースホルダを置く。
      # Linux の実行ファイルはスタブのみで ruby.wasm を読まないので空で問題ない。
      - name: Stub ruby.wasm resource
        run: touch Sources/WindowManager/Resources/ruby.wasm

      - name: swift test
        run: swift test

  # macOS 実機向けのビルド確認（高速ゲート）。WasmKit / ruby.wasm 連携の **コンパイル**を検証する。
  macos-build:
    name: macOS (build)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Stub ruby.wasm resource
        run: touch Sources/WindowManager/Resources/ruby.wasm

      - name: swift build
        run: swift build

  # バージョンの唯一の置き場は bundle/Info.plist。そこから v<version> を決め、
  # main への push でその Release がまだ無ければ macos-app を動かす（plist を上げる = リリース）。
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version from Info.plist
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r short build < <(python3 - <<'PY'
          import plistlib
          d = plistlib.load(open("bundle/Info.plist", "rb"))
          print(d["CFBundleShortVersionString"], d["CFBundleVersion"])
          PY
          )
          if [ "$short" != "$build" ]; then
            echo "::error::CFBundleShortVersionString ($short) と CFBundleVersion ($build) が一致しません"
            exit 1
          fi
          tag="v$short"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # 手動実行は常にビルド。main への push は、その Release が未作成のときだけビルド。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] \
               && ! gh release view "$tag" >/dev/null 2>&1; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  # .app バンドルを実際に組み立てて成果物にする。
  # - main への push で Info.plist のバージョンの Release が未作成: Release を作成して .app を添付。
  # - 手動実行（workflow_dispatch）: artifact を出す。main 上なら既存 Release の .app も差し替える（--clobber）。
  # ※ adhoc 署名のみ（未公証）。他 Mac では初回 右クリック→開く 等が必要。実機での
  #   ウィンドウ操作・権限付与は CI では検証できない（ビルド成果物の提供のみ）。
  macos-app:
    name: macOS (.app release)
    needs: version
    runs-on: macos-14
    if: needs.version.outputs.build == 'true'
    timeout-minutes: 20 # swift build -c release + ruby.wasm 取得を含むため長め
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # 実 ruby.wasm（@ruby/3.x-wasm-wasi の ruby+stdlib.wasm）を npm から取得して同梱。
      - name: Fetch ruby.wasm
        run: make fetch-ruby

      # swift build -c release → .app 組み立て + adhoc 署名（Makefile の app ターゲット）。
      - name: Build WindowManager.app
        run: make app

      # .app はディレクトリなので、実行ビット/構造を保つため ditto で zip 化する。
      - name: Package .app
        run: ditto -c -k --keepParent WindowManager.app WindowManager.app.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: WindowManager-app
          path: WindowManager.app.zip
          if-no-files-found: error

      # main 上でのみ Release を作成・更新する。タグは gh が runner 内で作成する
      # （GITHUB_TOKEN 由来のタグは他の workflow を起動しないので二重実行にならない）。
      - name: Attach to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          notes=$'WindowManager.app（adhoc 署名 / 未公証）。\n\n初回起動: 右クリック→開く、または\n  xattr -dr com.apple.quarantine WindowManager.app\nアクセシビリティ等の権限はシステム設定で付与してください。'
          gh release create "$TAG" WindowManager.app.zip \
            --target "$GITHUB_SHA" --title "$TAG" --notes "$notes" \
          || gh release upload "$TAG" WindowManager.app.zip --clobber
